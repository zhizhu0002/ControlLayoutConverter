name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # v3 默认安装 'tools platform-tools'，而旧版 'tools' 包已从 Google SDK 仓库移除，
          # sdkmanager 会以 "Failed to find package 'tools'" 退出码 1 直接失败。
          # 这里覆写为只装 platform-tools；编译所需的 platform/build-tools 在下一步显式安装。
          packages: 'platform-tools'

      - name: Install required SDK packages
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          echo "--- 已安装的 platforms ---"
          ls "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/platforms"
          echo "--- 已安装的 build-tools ---"
          ls "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 修复本机 Termux 特定的 gradlew shebang 与 aapt2 路径，让 CI（Ubuntu）可执行
      - name: Make gradlew portable for CI
        run: |
          sed -i '1s|^#!.*$|#!/bin/sh|' gradlew
          sed -i '/aapt2FromMavenOverride/d' gradle.properties || true
          echo "--- gradlew shebang ---"
          head -1 gradlew
          echo "--- gradle.properties (CI) ---"
          cat gradle.properties

      # 仅当提供 RELEASE_KEYSTORE base64 时解码签名密钥（Push/Pull 时可跳过）
      - name: Decode release keystore
        if: env.RELEASE_KEYSTORE != ''
        run: |
          echo "${{ env.RELEASE_KEYSTORE }}" | base64 --decode > release.keystore
          chmod 600 release.keystore

      - name: Build Debug APK
        run: sh gradlew assembleDebug --stacktrace

      - name: Build Signed Release APK
        if: env.RELEASE_KEYSTORE != '' && env.KEYSTORE_PASSWORD != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != ''
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: sh gradlew assembleRelease --stacktrace

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: controlconverter-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Release APK artifact
        if: env.RELEASE_KEYSTORE != ''
        uses: actions/upload-artifact@v4
        with:
          name: controlconverter-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 7
