name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 移除本机专用的 aapt2 路径覆盖，让 CI 使用标准 SDK 的 aapt2
      - name: Strip machine-specific aapt2 override
        run: |
          sed -i '/aapt2FromMavenOverride/d' gradle.properties || true
          echo "--- gradle.properties (CI) ---"
          cat gradle.properties

      # 仅当提供 RELEASE_KEYSTORE base64 时解码签名密钥（Push/Pull 时可跳过）
      - name: Decode release keystore
        if: env.RELEASE_KEYSTORE != ''
        run: |
          echo "${{ env.RELEASE_KEYSTORE }}" | base64 --decode > release.keystore
          chmod 600 release.keystore

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Signed Release APK
        if: env.RELEASE_KEYSTORE != '' && env.KEYSTORE_PASSWORD != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != ''
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: controlconverter-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Release APK artifact
        if: env.RELEASE_KEYSTORE != ''
        uses: actions/upload-artifact@v4
        with:
          name: controlconverter-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 7
